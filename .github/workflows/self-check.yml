name: Self-check

# This repo's own gate: doc links resolve, the template's workflows and the scripts pass Zizmor
# and a syntax check, the template's size script runs, and the tree passes the secret scan.
on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Doc links
        run: node template/scripts/check-doc-links.mjs
      - name: Script syntax
        run: bash -n scripts/*.sh
      - name: Template size script runs
        run: node template/scripts/check-policies.mjs
      - name: Zizmor
        run: pipx run zizmor==1.31.1 --offline --min-severity medium .github template/.github
      - name: Plugin manifests are valid JSON
        run: |
          jq empty .claude-plugin/marketplace.json plugin/.claude-plugin/plugin.json scripts/ruleset.base.json

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan
        run: gitleaks dir . --redact --no-banner --exit-code 1

  all:
    runs-on: ubuntu-latest
    needs: [checks, secret-scan]
    if: always()
    permissions: {}
    steps:
      - name: Decide whether checks have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "Some checks failed: $RESULTS"
              exit 1
            fi
          done
          echo "All checks passed"
