name: Performance

# k6 tripwire for order-of-magnitude regressions. Nightly and on demand, never per PR, and not a
# required check: it boots the full app and runner timings are noisy.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: 'smoke (default) or stress'
        default: smoke
        type: choice
        options: [smoke, stress]

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Setup k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
      - name: Boot the app
        run: |
          dotnet run -c Release --project src/MyRepo.Site --urls http://127.0.0.1:8080 > app.log 2>&1 &
          for _ in $(seq 1 140); do
            curl -sf -o /dev/null http://127.0.0.1:8080/ && exit 0
            sleep 3
          done
          cat app.log
          exit 1
      - name: Run k6
        env:
          PROFILE: ${{ inputs.profile || 'smoke' }}
        run: k6 run -e BASE_URL=http://127.0.0.1:8080 -e PROFILE="$PROFILE" --summary-export=k6-summary.json tests/perf/smoke.js
      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k6-summary
          path: k6-summary.json
