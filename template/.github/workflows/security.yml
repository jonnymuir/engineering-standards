name: Security

# SAST and supply-chain checks from jonnymuir/ci-security. Require "security / security-all",
# "CodeQL" and "zizmor" in the ruleset.
on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC, re-scan against newly published advisories
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: jonnymuir/ci-security/.github/workflows/dotnet-security.yml@d5663651482851ef824487236a7506da02306bef # v1
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
    with:
      solution: MyRepo.slnx
      # node-build: '["src/MyRepo.Client"]'
